name: Deploy to EC2
on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: SSH and Deploy with Docker
        env:
          PRIVATE_KEY: ${{ secrets.SSH_SECRET_KEY }}
          HOST: ${{ secrets.HOST }}
          USER: ${{ secrets.USERNAME }}
          APP_DIRECTORY: ${{ secrets.APP_DIRECTORY }}
        run: |
          echo "$PRIVATE_KEY" > github-ec2.pem
          chmod 600 github-ec2.pem 

          ssh -o StrictHostKeyChecking=no -i github-ec2.pem "${USER}"@"${HOST}" \
            cd $APP_DIRECTORY && \
            chmod 777 deploy.sh && \
            ./deploy.sh

          # Clean up temporary key file
          rm -f github-ec2.pem
