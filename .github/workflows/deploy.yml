name: Deploy to AWS EC2

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_SECRET_KEY }}" > ~/.ssh/private_key
          chmod 600 ~/.ssh/private_key
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          echo "Connecting to EC2 instance..."
          ssh -i ~/.ssh/private_key -o ConnectTimeout=10 -o StrictHostKeyChecking=no ${{ secrets.USERNAME }}@${{ secrets.HOST }} << 'EOF'
            echo "Successfully connected to EC2 instance"
            echo "Executing restart script..."
            ./restart.sh
            echo "Deployment completed"
          EOF

      - name: Clean up
        if: always()
        run: |
          rm -f ~/.ssh/private_key
