services:
  realestate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: realestate
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - edunetwork
  
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - edunetwork
    
  nginx-server:
      image: nginx:alpine
      container_name: nginx-server
      ports:
      - "80:80"
      volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      restart: unless-stopped
      networks:
        - edunetwork

networks:
  edunetwork:
    driver: bridge

volumes:
  redis-data: