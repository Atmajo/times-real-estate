services:
  realestate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: realestate
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - realestate
  
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - realestate

networks:
  realestate:
    driver: bridge

volumes:
  redis-data: